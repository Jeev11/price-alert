<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="robots" content="noindex">
  <title>{% block title %}Price Alert for Amazon.in{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap foot">
    <p>Your email is stored encrypted and used only for these alerts. Every email has a link that deletes everything we hold about you.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
